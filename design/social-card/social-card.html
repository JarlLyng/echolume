<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@700;800&display=block" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#000}
  .card{position:relative;width:1200px;height:630px;background:#000;color:#fff;font-family:Inter,sans-serif;overflow:hidden}
  .art{position:absolute;inset:0;background:url("../../docs/images/hero-poster.jpg") no-repeat;background-size:auto 100%;background-position:255px -79px}
  .scrim{position:absolute;inset:0;background:
      linear-gradient(90deg,rgba(0,0,0,.97) 0%,rgba(0,0,0,.9) 36%,rgba(0,0,0,.35) 58%,rgba(0,0,0,0) 72%),
      radial-gradient(120% 90% at 75% 50%,transparent 55%,rgba(0,0,0,.55) 100%)}
  .copy{position:absolute;left:76px;top:0;bottom:0;width:600px;display:flex;flex-direction:column;justify-content:center}
  .mark{display:flex;align-items:center;gap:14px;font-family:Outfit,sans-serif;font-weight:800;font-size:34px;letter-spacing:-.02em;margin-bottom:34px}
  .mark i{width:15px;height:15px;border-radius:50%;background:#23ACC7;box-shadow:0 0 14px #23ACC7}
  h1{margin:0;font-family:Outfit,sans-serif;font-weight:800;font-size:66px;line-height:1.04;letter-spacing:-.03em}
  p{margin:24px 0 0;font-size:25px;line-height:1.4;color:rgba(255,255,255,.72);max-width:520px}
  .buy{margin-top:40px;display:flex;align-items:center;gap:16px;font-size:21px;font-weight:600}
  .pill{padding:9px 20px;border-radius:100px;color:#23ACC7;background:rgba(35,172,199,.1);border:1.5px solid rgba(35,172,199,.45)}
  .url{position:absolute;left:76px;bottom:38px;font-size:18px;color:rgba(255,255,255,.4);font-weight:500}
</style></head>
<body><div class="card">
  <div class="art"></div><div class="scrim"></div>
  <div class="copy">
    <div class="mark"><i></i>Echolume</div>
    <h1>Live audio&#8209;reactive visuals for macOS</h1>
    <p>Pick an input, choose a theme, hit Ready. Your music drives the rest.</p>
    <div class="buy"><span class="pill">$19.99 once</span><span>Mac App Store</span></div>
  </div>
  <div class="url">echolume.iamjarl.com</div>
</div></body></html>
